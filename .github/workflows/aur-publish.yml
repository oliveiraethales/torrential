name: Publish to AUR

# Only publishes when a version tag is pushed (e.g. `v0.2.0`) or when manually
# dispatched. Pushes to `main` no longer trigger AUR releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v, e.g. 0.2.0). Required for manual dispatch.'
        required: true
        type: string

concurrency:
  group: aur-publish
  cancel-in-progress: false

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Build the Linux release tarball and publish a GitHub release.
  # This job does NOT have access to the AUR SSH key.
  # ---------------------------------------------------------------------------
  build-and-release:
    name: Build & publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_name: ${{ steps.ver.outputs.release_name }}
      sha256: ${{ steps.pkg.outputs.sha256 }}

    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version from tag or input
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${DISPATCH_VERSION:-}" ]]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            echo "::error::Could not determine version: not a tag push and no version input provided." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+.-][A-Za-z0-9.+-]+)?$ ]]; then
            echo "::error::Version '$VERSION' does not look like a valid semver." >&2
            exit 1
          fi
          echo "version=${VERSION}"      >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "release_name=torrential-${VERSION}-linux-x86_64" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang ninja-build cmake pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv

      - name: Set up Flutter
        # subosito/flutter-action@v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package release tarball
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_NAME: ${{ steps.ver.outputs.release_name }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="build/linux/x64/release/bundle"
          RELEASE_DIR="build/release/${RELEASE_NAME}"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          cp -r "$BUNDLE_DIR"/* "$RELEASE_DIR/"

          mkdir -p "$RELEASE_DIR/icons"
          for size in 16 32 48 64 128 256 512; do
            mkdir -p "$RELEASE_DIR/icons/hicolor/${size}x${size}/apps"
            cp "assets/icon/torrential-${size}.png" \
               "$RELEASE_DIR/icons/hicolor/${size}x${size}/apps/com.torrential.torrential.png"
          done

          cp linux/com.torrential.torrential.desktop "$RELEASE_DIR/"

          cat > "$RELEASE_DIR/install.sh" <<'INSTALL_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          INSTALL_DIR="${1:-$HOME/.local/opt/torrential}"
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR" "$BIN_DIR"
          cp -r "$SCRIPT_DIR/torrential" "$SCRIPT_DIR/data" "$SCRIPT_DIR/lib" "$INSTALL_DIR/"
          ln -sf "$INSTALL_DIR/torrential" "$BIN_DIR/torrential"
          for size_dir in "$SCRIPT_DIR"/icons/hicolor/*/apps; do
            size=$(basename "$(dirname "$size_dir")")
            dest="$HOME/.local/share/icons/hicolor/$size/apps"
            mkdir -p "$dest"
            cp "$size_dir/com.torrential.torrential.png" "$dest/"
          done
          sed "s|Exec=torrential|Exec=$INSTALL_DIR/torrential|" \
            "$SCRIPT_DIR/com.torrential.torrential.desktop" \
            > "$HOME/.local/share/applications/com.torrential.torrential.desktop"
          INSTALL_EOF
          chmod +x "$RELEASE_DIR/install.sh"

          cd build/release
          tar czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"
          SHA256=$(sha256sum "${RELEASE_NAME}.tar.gz" | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Tarball sha256: ${SHA256}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_NAME: ${{ steps.ver.outputs.release_name }}
        run: |
          set -euo pipefail
          TARBALL="build/release/${RELEASE_NAME}.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading/replacing asset."
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --title "Torrential ${VERSION}" \
              --notes "Automated release for commit ${GITHUB_SHA}." \
              --target "${GITHUB_SHA}"
          fi

  # ---------------------------------------------------------------------------
  # Push the new PKGBUILD to the AUR. Lives in the `aur` Environment so the
  # SSH key is gated behind a manual approval (configure required reviewers
  # at: Settings -> Environments -> aur).
  # ---------------------------------------------------------------------------
  publish-aur:
    name: Push PKGBUILD to AUR
    needs: build-and-release
    runs-on: ubuntu-latest
    environment: aur
    permissions: {}

    steps:
      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set in the 'aur' environment." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Push update to AUR
        env:
          VERSION: ${{ needs.build-and-release.outputs.version }}
          SHA256: ${{ needs.build-and-release.outputs.sha256 }}
          AUR_REPO: ssh://aur@aur.archlinux.org/torrential.git
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          git -C "$WORKDIR" clone "$AUR_REPO" .
          git -C "$WORKDIR" config user.name "Torrential CI"
          git -C "$WORKDIR" config user.email "oliveiraethales@gmail.com"

          cat > "$WORKDIR/PKGBUILD" <<EOF
          # Maintainer: Tháles de Oliveira <oliveiraethales@gmail.com>
          pkgname=torrential
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc='A sleek Linux TIDAL client with Hi-Res FLAC support (24-bit/192kHz)'
          arch=('x86_64')
          url='https://github.com/oliveiraethales/torrential'
          license=('MIT')
          depends=('gtk3' 'mpv')
          source=("\${pkgname}-\${pkgver}.tar.gz::https://github.com/oliveiraethales/torrential/releases/download/v\${pkgver}/torrential-\${pkgver}-linux-x86_64.tar.gz")
          sha256sums=('${SHA256}')

          package() {
            cd "\${pkgname}-\${pkgver}-linux-x86_64"

            install -d "\${pkgdir}/opt/\${pkgname}"
            cp -r torrential data lib "\${pkgdir}/opt/\${pkgname}/"

            install -d "\${pkgdir}/usr/bin"
            ln -s "/opt/\${pkgname}/torrential" "\${pkgdir}/usr/bin/torrential"

            install -Dm644 com.torrential.torrential.desktop \\
              "\${pkgdir}/usr/share/applications/com.torrential.torrential.desktop"

            sed -i 's|Exec=torrential|Exec=/opt/torrential/torrential|' \\
              "\${pkgdir}/usr/share/applications/com.torrential.torrential.desktop"

            for size in 16 32 48 64 128 256 512; do
              install -Dm644 "icons/hicolor/\${size}x\${size}/apps/com.torrential.torrential.png" \\
                "\${pkgdir}/usr/share/icons/hicolor/\${size}x\${size}/apps/com.torrential.torrential.png"
            done
          }
          EOF

          # Generate .SRCINFO using a pinned Arch image. The digest below is for
          # archlinux:base-devel-20260510.0.525573 — bump intentionally as needed.
          ARCH_IMAGE='archlinux@sha256:6ec1f5073a94d877ae97ebf68e507f709b395c7a90005fe92d9db1c21f933077'
          docker run --rm -v "$WORKDIR":/pkg -w /pkg "$ARCH_IMAGE" bash -c '
            pacman -Sy --noconfirm --needed base-devel >/dev/null 2>&1 || true
            useradd -m builder
            chown -R builder /pkg
            sudo -u builder makepkg --printsrcinfo > .SRCINFO
          '

          git -C "$WORKDIR" add PKGBUILD .SRCINFO
          if git -C "$WORKDIR" diff --cached --quiet; then
            echo "No AUR changes to push."
            exit 0
          fi
          git -C "$WORKDIR" commit -m "Update to ${VERSION}"
          git -C "$WORKDIR" push
